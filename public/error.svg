<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="80" height="80" fill="none"
  aria-hidden="true" data-patched="1" data-ff-patched="1" stroke="red">
  <g>
    <animateTransform attributeName="transform" type="translate" values="20,20;20,20" dur="4000ms"
      repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0 0 1 1"
      additive="replace" data-original-dur="4s" begin="0s"></animateTransform>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0,0,0;0,0,0" dur="4000ms"
        repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0 0 1 1"
        additive="replace" data-original-dur="4s" begin="0s"></animateTransform>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,1;1,1" dur="4000ms"
          repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0 0 1 1"
          additive="replace" data-original-dur="4s" begin="0s"></animateTransform>
        <circle cx="0" cy="0" r="10" fill="none"  stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"
          style="opacity: 1;"></circle>
      </g>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="20,20;20,20" dur="4000ms"
      repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.87 0 0.13 1"
      additive="replace" data-original-dur="4s" begin="0s"></animateTransform>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0,0,0;360,0,0" dur="4000ms"
        repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.87 0 0.13 1"
        additive="replace" data-original-dur="4s" begin="0s"></animateTransform>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,1;1,1" dur="4000ms"
          repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.87 0 0.13 1"
          additive="replace" data-original-dur="4s" begin="0s"></animateTransform>
        <path d="M4.929 4.929 19.07 19.071" transform="translate(-12,-12)" fill="none"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          vector-effect="non-scaling-stroke" style="opacity: 1;"></path>
      </g>
    </g>
  </g>
</svg>