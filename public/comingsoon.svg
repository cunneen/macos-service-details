<svg
  width="250px"
  viewBox="0 0 250 250"
  xmlns="http://www.w3.org/2000/svg"
  class="screenshotsvg"
>
  <title>Screenshot Coming Soon</title>
  <defs>
    <style>/* <![CDATA[ */
      :root {
        --dark-color: #222222;
        --light-color: #dddddd;
      }

      .screenshotsvg {
        background-color: var(--light-color);
        padding: 5%;
        border: 1% solid var(--dark-color);
        width: 100%;
        height: 100%;
        box-sizing: border-box;
      }

      .textHeading {
        stroke: var(--dark-color);
        fill: var(--dark-color);
        font-size: 100%;
        font-weight: bold;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        .screenshotsvg {
          background-color: var(--dark-color);
          border-color: var(--light-color);

        }

        .textHeading {
          stroke: var(--light-color);
          fill: var(--light-color);
        }
      }
      /* ]]> */
    </style>
  </defs>
  <desc>Screenshot Coming Soon</desc>
  <text
    class="textHeading"
    x="47%"
    y="43%"
    text-anchor="middle">
    Screenshot Coming
  </text>
  <text
    class="textHeading"
    x="47%"
    y="51%"
    text-anchor="middle">
    Soon
  </text>
</svg>